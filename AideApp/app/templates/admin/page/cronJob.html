{% extends 'admin/share/master.html' %}
{% block body %}
<div class="row">
    <div class="col-md-12">
        <div class="main-card mb-3 card">
            <div class="card-body">
                <div class="card-title">Cron Job With Aide GUI</div>
                <div class="row">
                    <div class="col-md-5 mb-3">
                        <label style="margin-top: 8px; font-weight: bold;">Name (Optional)</label> 
                        <input id="cronName" type="text" class="form-control" placeholder="">
                    </div>  
                    <div class="col-md-5 mb-3">
                        <div class="position-relative form-group">
                        <label style="margin-top: 8px; font-weight: bold;">Configuration Template(Optional)</label> 
                        <select id="cronConfigFile" class="form-control" name="configuration">
                            <!-- <option value="">Default</option> -->
                        </select>
                        </div>      
                    </div>
                    <div class="col-md-2 mb-3">
                        <br>
                        <br>
                        <button type="button" class="mb-2 mr-2 btn btn-info" id="viewConfig" data-toggle="modal" data-target="#showConfig" >View Config</button>
                    </div> 
                    <div class="col-md-12 mb-3">
                        <label style="margin-top: 8px; font-weight: bold;">Quick Schedule</label> 
                    </div>
                    <div class="col-md-12 mb-3">
                        <button id="startup" type="button" class="col-md-1 mb-2 mr-2 btn btn-primary">Startup</button>
                        <button id="hourly" type="button" class="col-md-1 mb-2 mr-2 btn btn-primary">Hourly</button>
                        <button id="daily" type="button" class="col-md-1 mb-2 mr-2 btn btn-primary">Daily</button>
                        <button id="weekly" type="button" class="col-md-1 mb-2 mr-2 btn btn-primary">Weekly</button>
                        <button id="monthly" type="button" class="col-md-1 mb-2 mr-2 btn btn-primary">Monthly</button>
                        <button id="yearly" type="button" class="col-md-1 mb-2 mr-2 btn btn-primary">Yearly</button>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label for="minute">Minute</label>
                        <!-- <input type="number" id="minute" class="form-control" placeholder="*" min="0" max="59" required> -->
                        <input type="text" id="minute" class="form-control" placeholder="*" required>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label for="hour">Hour</label>
                        <!-- <input type="number" id="hour" class="form-control" placeholder="*" min="0" max="23" required> -->
                        <input type="text" id="hour" class="form-control" placeholder="*" required>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label for="day">Day</label>
                        <!-- <input type="number" id="day" class="form-control" placeholder="*" min="1" max="31" required> -->
                        <input type="text" id="day" class="form-control" placeholder="*" required>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label for="month">Month</label>
                        <!-- <input type="number" id="month" class="form-control" placeholder="*" min="1" max="12" required> -->
                        <input type="text" id="month" class="form-control" placeholder="*" required>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label for="week">Week</label>
                        <!-- <input type="number" id="week" class="form-control" placeholder="*" min="0" max="6" required> -->
                        <input type="text" id="week" class="form-control" placeholder="*" required>
                    </div>  
                    <div class="col-md-12 mb-3">
                        <label>Job</label>
                        <input id="cronjobDemo" type="text" class="form-control" readonly placeholder="">
                    </div> 
                    <input type="checkbox" id="mailingCheck"  value="true" style="margin-right: 6px; margin-left: 7px">  
                    <label style="margin-top: 8px;">Send Aide Scanning Result Via Email</label> 
                </div>
                <div class="row"> 
                    <div class="col-md-5 mailDis" style="display: none">
                        <div class="position-relative form-group">
                            <label for="MAILTO">Recipient Email Address</label>
                            <input type="email" id="mailTo" class="form-control" name="MAILTO" value="" placeholder="example@example.com">
                        </div>
                    </div>
                    <div class="col-md-5 mailDis" style="display: none">
                        <div class="position-relative form-group">
                            <label for="MAILSUBJ">Email Subject</label>
                            <input id="mailSub" type="text" class="form-control" name="MAILSUBJ" value="Daily AIDE report for AIDEServer" placeholder="Daily AIDE report for $FQDN">
                        </div>
                    </div>
                    <div class="col-md-2 mailDis" style="display: none">
                        <div class="position-relative form-group">
                            <label for="QUIETREPORTS">QUIETREPORTS</label>
                            <select id="quiteSelect" class="form-control" name="QUIETREPORTS">
                                <option value="no">no</option>
                                <option value="yes">yes</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <div id="timestamp"></div> 
                    <div class="btn-actions-pane-right">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="button" id="setCronJob" class="btn btn-primary">Set</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block modal %}
<div class="modal fade bd-example-modal-lg show" id="showConfig" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-modal="true" style="display: none;">
    <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel4">Delete Scan Confirm</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close" >
                    <span aria-hidden="true">×</span>
                </button>
            </div>
            <div class="modal-body">
                <div class="row" >
                    <div class="col-md-12">
                        <div class="main-card mb-3 card" id="fileContent2">
                            <!-- <div class="card-body">
                                <h5 class="card-title">Basic Example</h5>
                                <p>Lorem ipsum dolor sit amet, consectetuer adipiscing elit. Aenean commodo ligula eget dolor. Aenean massa.</p>
                            </div> -->
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                <!-- <button type="button" class="btn btn-primary" id="confirmDelete">yes</button> -->
            </div>
        </div>
    </div>
</div>  
{% endblock %}
{% block script %}
<script>
    document.addEventListener('DOMContentLoaded', function () {

        document.getElementById('viewConfig').addEventListener('click', function (event) {
        let fileName = document.getElementById('cronConfigFile').value;
            console.log(fileName)
        function fetchFileContent(fileName) {
            fetch(`/get-config-content?filename=${encodeURIComponent(fileName)}`)
                .then(response => response.json())
                .then(data => {
                    let fileList = document.getElementById('fileContent2');
                    fileList.innerHTML = ""; // Xóa nội dung cũ

                    if (data.error) {
                        toastr.error("Error loading file.", data.error);
                    } else {
                        // Kiểm tra nếu nội dung không tồn tại
                        let fileContent = data.content ? data.content.replace(/\r?\n/g, "<br>") : "No content available.";

                        fileList.innerHTML = `
                            <div class="card-body">
                                <h5 class="card-title">${data.filename}</h5>
                                <p>${fileContent}</p>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.log('Error fetching file:', error);
                    toastr.error("An unexpected error occurred.");
                });
        }

        // **Call the function after defining it**
        fetchFileContent(fileName);
    });



        fetch("/select-config")
        .then(response => response.json())
        .then(data => {
            let select = document.getElementById("cronConfigFile");
            if (data.files) {
                data.files.forEach(file => {
                    let option = document.createElement("option");
                    option.value = file;
                    option.textContent = file;
                    select.appendChild(option);
                });
            }
        })
        .catch(error => console.error("Error fetching config files:", error));




        document.getElementById("mailingCheck").addEventListener('click', function () {
            let mailFields = document.getElementsByClassName("mailDis");
            for (let i = 0; i < mailFields.length; i++) {
                mailFields[i].style.display = this.checked ? "block" : "none";
            }
        });

        let minute = document.getElementById('minute');
        let hour = document.getElementById('hour');
        let day = document.getElementById('day');
        let month = document.getElementById('month');
        let week = document.getElementById('week');
    
        function updateCronJob() {
            let min = minute.value.trim() || '*';
            let hr = hour.value.trim() || '*';
            let d = day.value.trim() || '*';
            let m = month.value.trim() || '*';
            let w = week.value.trim() || '*';
            
            document.getElementById('cronjobDemo').value = `${min} ${hr} ${d} ${m} ${w} /usr/share/aide/bin/dailyaidecheck --crondaily`;
        }
        [minute, hour, day, month, week].forEach((input) => {
            input.addEventListener('input', updateCronJob);
        });
        function setCronValues(min, hr, d, m, w) {
            document.getElementById('minute').value = min;
            document.getElementById('hour').value = hr;
            document.getElementById('day').value = d;
            document.getElementById('month').value = m;
            document.getElementById('week').value = w;
            updateCronJob();
        }

        document.getElementById('startup').addEventListener('click', function (event) {
            event.preventDefault();
            setCronValues('', '', '', '', '');
            document.getElementById('cronjobDemo').value = '@reboot /usr/share/aide/bin/dailyaidecheck --crondaily';
        });

        document.getElementById('hourly').addEventListener('click', function (event) {
            event.preventDefault();
            setCronValues('0', '*', '*', '*', '*');
        });

        document.getElementById('daily').addEventListener('click', function (event) {
            event.preventDefault();
            setCronValues('0', '0', '*', '*', '*');
        });

        document.getElementById('weekly').addEventListener('click', function (event) {
            event.preventDefault();
            setCronValues('0', '0', '*', '*', '0');
        });

        document.getElementById('monthly').addEventListener('click', function (event) {
            event.preventDefault();
            setCronValues('0', '0', '1', '*', '*');
        });

        document.getElementById('yearly').addEventListener('click', function (event) {
            event.preventDefault();
            setCronValues('0', '0', '1', '1', '*');
        });

        document.getElementById('setCronJob').addEventListener('click', function (event) {
        event.preventDefault();
        let formData = new FormData();
        formData.append('quiteReport', document.getElementById('quiteSelect').value);
        formData.append('name', document.getElementById('cronName').value);
        formData.append('configFile', document.getElementById('cronConfigFile').value);
        formData.append('minute', document.getElementById('minute').value);
        formData.append('hour', document.getElementById('hour').value);
        formData.append('day', document.getElementById('day').value);
        formData.append('month', document.getElementById('month').value);
        formData.append('week', document.getElementById('week').value);
        formData.append('mail', document.getElementById('mailTo').value);
        formData.append('mailSubject', document.getElementById('mailSub').value);

        fetch('/cron-job', {
            method: 'POST',
            body: formData,
        })
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                toastr.error(`Error: ${data.error}`);
            } else {
                toastr.success('Cron job created successfully!');
                setTimeout(() => location.reload(), 1000);
            }
        })
        .catch(error => toastr.error(`Error: ${error.message}`));
    });
});
</script>
{% endblock %}
